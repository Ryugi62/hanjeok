name: weather-refresh
# 기상청 단기예보(공공데이터포털 오픈API) 강수확률만 매일 갱신한다.
# 데이터랩 값은 공식 「데이터 다운로드」 파일로만 교체한다(자동 수집 없음 — SPEC §2).
on:
  schedule:
    - cron: '30 21 * * *' # 06:30 KST
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  weather:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node src/infrastructure/refreshWeather.js
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
      - name: commit snapshot
        run: |
          git config user.name "hanjeok-bot"
          git config user.email "hanjeok-bot@users.noreply.github.com"
          git add public/data/snapshot.json
          git diff --cached --quiet || git commit -m "data: 기상청 강수확률 갱신 $(date -u -d '+9 hour' +%Y-%m-%d)"
          git push
