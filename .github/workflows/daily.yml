name: daily-collect
on:
  schedule:
    - cron: '30 21 * * *' # 06:30 KST
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node src/infrastructure/collect.js
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
      - run: node src/infrastructure/stability.js
      - name: commit snapshot
        run: |
          git config user.name "hanjeok-bot"
          git config user.email "hanjeok-bot@users.noreply.github.com"
          git add public/data data/raw
          git diff --cached --quiet || git commit -m "data: 데이터랩 집중률 스냅샷 $(date -u -d '+9 hour' +%Y-%m-%d)"
          git push
