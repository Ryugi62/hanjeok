<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7일 혼잡 예보 — 한적한 날</title>
<style>
:root { --ink:#191F28; --sub:#4E5968; --faint:#6B7684; --line:#E5E8EB; --quiet:#1FA463; --normal:#F2A100; --busy:#F04452; --blue:#3182F6;
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif; color: var(--ink); }
* { box-sizing: border-box; }
body { margin: 0; background: #fff; }
.w { border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; max-width: 560px; }
.h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.h b { font-size: 16px; }
.h a { font-size: 12px; color: var(--faint); text-decoration: none; }
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 10px; }
.d { text-align: center; font-size: 12px; color: var(--sub); }
.d .bx { height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }
.d.best .bx { outline: 2px solid var(--ink); outline-offset: 1px; }
.quiet { background: var(--quiet); } .normal { background: var(--normal); } .busy { background: var(--busy); }
.normal { color: #3a2a00 !important; }
.s { margin: 10px 0 0; font-size: 13px; color: var(--sub); }
</style>
</head>
<body>
<div class="w" id="w"><p class="s">불러오는 중이에요.</p></div>
<script type="module" src="/embed.js"></script>
</body>
</html>
